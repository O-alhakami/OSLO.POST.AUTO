<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }} · Sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="auth-page">
  <div class="orb orb-one"></div>
  <div class="orb orb-two"></div>

  <main class="auth-shell">
    <section class="auth-panel panel">
      <div class="brand-block">
        <div class="brand-badge">OS</div>
        <div>
          <p class="eyebrow">Social publishing suite</p>
          <h1>{{ app_name }}</h1>
        </div>
      </div>

      <div class="hero-copy">
        <h2>One place. Every post.</h2>
        <p>Compose once, schedule everywhere, and keep your publishing pipeline under control.</p>
      </div>

      <form id="auth-form" class="auth-form">
        <label class="input-group">
          <span>Email</span>
          <input class="field" type="email" name="email" autocomplete="email" required>
        </label>

        <label class="input-group">
          <span>Password</span>
          <input class="field" type="password" name="password" autocomplete="current-password" minlength="8" required>
        </label>

        <p id="auth-message" class="form-status" role="status"></p>

        <div class="auth-actions">
          <button class="button-primary" type="submit" data-endpoint="/auth/login">Sign in</button>
          <button class="button-secondary" type="submit" data-endpoint="/auth/signup">Create account</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/static/app.js" defer></script>
</body>
</html>
